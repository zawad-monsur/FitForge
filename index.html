<!doctype html>
<html lang="en" data-theme="auto" data-accent="terracotta" data-density="cozy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FitForge — Train smarter, eat better</title>
<meta name="description" content="A gym and diet planner built around your actual equipment, kitchen and schedule.">
<meta name="theme-color" content="#fdfbf7">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><rect width=%2224%22 height=%2224%22 rx=%226%22 fill=%22%23c4633f%22/><path d=%22M6.5 6.5 17.5 17.5M21 21l-1.9-1.9M3.9 3.9 5.8 5.8%22 stroke=%22%23fffaf5%22 stroke-width=%222.2%22 stroke-linecap=%22round%22/></svg>">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FitForge">

<!-- General Sans + Satoshi are Fontshare (Indian Type Foundry) faces, not on
     Google Fonts — served from Fontshare's own CSS API. Both fall back
     cleanly to system-ui if this request is blocked or offline. -->
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@500,600,700&f[]=satoshi@400,500,600,700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/screens.css">
</head>
<body>

<!-- One-time entrance splash — plain markup so it paints before any JS runs.
     js/app.js fades it out after boot, once, and never shows it again this
     session (screen re-renders and navigation never touch it). -->
<div id="boot-splash" class="boot-splash" aria-hidden="true">
  <div class="boot-splash__mark">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M6.5 6.5 17.5 17.5M21 21l-1.9-1.9M3.9 3.9 5.8 5.8" stroke="#FFFAF5" stroke-width="2.2" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="boot-splash__name">FitForge</div>
</div>

<a class="skip-link" href="#app">Skip to content</a>

<!-- Main application shell — built and populated by js/app.js -->
<div id="app" class="app" hidden></div>

<!-- Fixed-position onboarding wizard — built by js/screens/onboarding.js -->
<div id="ob-overlay" hidden></div>

<noscript>
  <div style="max-width:520px;margin:80px auto;padding:32px;font-family:system-ui,sans-serif;text-align:center;">
    <h1 style="margin-bottom:12px;">FitForge needs JavaScript</h1>
    <p>This app runs entirely in your browser with no server — please enable JavaScript to use it.</p>
  </div>
</noscript>

<!-- Data -->
<script src="js/data/exercises.js"></script>
<script src="js/data/recipes.js"></script>

<!-- Core -->
<script src="js/core/store.js"></script>
<script src="js/core/calc.js"></script>
<script src="js/core/planner.js"></script>
<script src="js/core/mealplanner.js"></script>
<script src="js/core/ai.js"></script>

<!-- UI helpers -->
<script src="js/ui/icons.js"></script>
<script src="js/ui/ui.js"></script>
<script src="js/ui/charts.js"></script>

<!-- Screens -->
<script src="js/screens/onboarding.js"></script>
<script src="js/screens/dashboard.js"></script>
<script src="js/screens/workout.js"></script>
<script src="js/screens/nutrition.js"></script>
<script src="js/screens/progress.js"></script>
<script src="js/screens/coach.js"></script>
<script src="js/screens/studio.js"></script>

<!-- Boot -->
<script src="js/app.js"></script>
</body>
</html>
